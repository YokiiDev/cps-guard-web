<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPS GUARD — Bridle your clicks</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://assets.codepen.io/16327/ScrollSmoother.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ff6600; 
            --accent-glow: rgba(255, 102, 0, 0.4);
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --btn-hover: #e65c00;
            --github-color: #1a1e22;
            --discord-color: #5865F2;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        #smooth-wrapper { width: 100%; height: 100vh; }
        #smooth-content { width: 100%; perspective: 1000px; }

        .bg-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1a1005 0%, transparent 70%);
            z-index: -1;
            opacity: 0.5;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            transform-style: preserve-3d;
        }

        h1 {
            font-size: clamp(3rem, 15vw, 7rem);
            line-height: 1;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        h1 .accent {
            color: var(--accent-color);
            text-shadow: 0 0 40px var(--accent-glow);
            font-weight: 900;
        }

        h1 .dim { font-weight: 300; opacity: 0.9; }

        .tagline {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: var(--text-secondary);
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: lowercase;
        }

        .stats {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }

        .stats span { color: var(--accent-color); font-weight: 700; }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: pointer;
            font-size: 1rem;
            color: white;
            border: none;
            white-space: nowrap;
        }

        .btn-main { background: var(--accent-color); box-shadow: 0 10px 30px rgba(255, 102, 0, 0.2); }
        .btn-main:hover { background: var(--btn-hover); transform: translateY(-3px); }
        
        .btn-github { background: var(--github-color); border: 1px solid var(--border); }
        .btn-github:hover { background: #24292e; transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }

        .btn svg { margin-right: 10px; width: 20px; height: 20px; fill: currentColor; }

        .video-section { 
            padding: 100px 20px;
            max-width: 1100px; 
            margin: 0 auto; 
            text-align: center;
            transform-style: preserve-3d;
        }

        .video-title { 
            font-size: clamp(1rem, 4vw, 1.2rem); 
            margin-bottom: 40px; 
            color: var(--text-secondary); 
            letter-spacing: 5px; 
            text-transform: uppercase; 
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9; 
            border-radius: clamp(12px, 4vw, 24px);
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            background: #000;
        }

        .video-container iframe { width: 100%; height: 100%; border: none; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background: #111;
            padding: clamp(20px, 8vw, 40px);
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            border: 1px solid var(--accent-color);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title { color: var(--accent-color); font-size: 1.5rem; margin-bottom: 20px; font-weight: 800; }
        .modal-steps { list-style: none; counter-reset: step; }
        .modal-steps li {
            margin-bottom: 12px; padding-left: 40px; position: relative;
            color: #ddd; font-size: 0.95rem;
        }
        .modal-steps li::before {
            content: counter(step); counter-increment: step;
            position: absolute; left: 0; top: -2px;
            width: 28px; height: 28px; background: var(--accent-color);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; font-weight: bold; color: white; font-size: 0.8rem;
        }

        .discord-floating {
            position: fixed;
            bottom: 25px; right: 25px;
            width: 55px; height: 55px;
            background: #2c2f33; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.3s; z-index: 1000; color: white;
            border: 1px solid var(--border);
        }
        .discord-floating:hover { transform: scale(1.1); background: var(--discord-color); }
        .discord-floating svg { width: 28px; height: 28px; fill: currentColor; }

        .show-more {
            position: absolute; bottom: 30px; 
            color: var(--text-secondary); background: none; border: none;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            gap: 8px; font-family: inherit; font-size: 0.8rem; letter-spacing: 2px;
        }
        .arrow-down { font-size: 1.2rem; animation: bounce 2s infinite; }

        footer { padding: 60px 20px; text-align: center; opacity: 0.5; font-size: 0.8rem; }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(6px);} }

        @media (max-width: 600px) {
            .btn { width: 100%; }
            .hero { padding-bottom: 100px; }
            .video-section { padding: 60px 15px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="download-modal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <h3 class="modal-title">Installation</h3>
            <ul class="modal-steps">
                <li>Télécharge le fichier <strong>CPS-Guard.zip</strong>.</li>
                <li>Extrais tout le contenu dans un dossier.</li>
                <li>Lance le <strong>.exe</strong> et profite !</li>
            </ul>
            <button class="btn btn-main" style="width: 100%; margin-top: 25px;" onclick="closeModal()">C'est compris !</button>
        </div>
    </div>

    <div id="smooth-wrapper">
        <div id="smooth-content">

            <section class="hero scroll-effect">
                <h1><span class="accent">CPS</span><span class="dim"> GUARD</span></h1>
                <div class="tagline">bridle your clicks</div>
                
                <div class="stats">Join <span id="download-count">0</span> users</div>
                
                <div class="btn-group">
                    <button onclick="handleDownload()" class="btn btn-main">
                        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                        Download
                    </button>
                    <a href="https://github.com/7controversed/CPS-Guard" target="_blank" class="btn btn-github">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.341-3.369-1.341-.454-1.152-1.11-1.459-1.11-1.459-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12c0-5.523-4.477-10-10-10z"/></svg>
                        Code Source
                    </a>
                </div>

                <button class="show-more" onclick="scrollToVideo()">
                    PREVIEW
                    <span class="arrow-down">↓</span>
                </button>
            </section>

            <section id="video" class="video-section scroll-effect">
                <h2 class="video-title">Preview & Setup</h2>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/RD1Rx8FWIzg" title="CPS GUARD Preview" allowfullscreen></iframe>
                </div>
            </section>

            <footer>
                <p>&copy; 2026 Developed by Controversed &bull; Design by Yokii</p>
            </footer>

        </div>
    </div>

    <a href="https://discord.gg/blsqad" target="_blank" class="discord-floating" aria-label="Discord">
        <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.82,56.6.48,80.1a105.73,105.73,0,0,0,32.22,16.26,77.7,77.7,0,0,0,7.34-11.86,68.43,68.43,0,0,1-11.85-5.65c.97-.69,1.92-1.42,2.83-2.18a74.17,74.17,0,0,0,65.12,0c.91.76,1.86,1.49,2.83,2.18a68.67,68.67,0,0,1-11.85,5.65,77.84,77.84,0,0,0,7.33,11.86,105.4,105.4,0,0,0,32.27-16.26C129.2,50.23,125.09,26.46,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5.07-12.7,11.41-12.7S54,46,53.84,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.07-12.7,11.44-12.7S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
    </a>

    <script>
        gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

        const smoother = ScrollSmoother.create({
            wrapper: "#smooth-wrapper",
            content: "#smooth-content",
            smooth: 1.2,
            effects: true,
            smoothTouch: 0.1
        });

        gsap.from(".hero > *", {
            y: 50,
            opacity: 0,
            filter: "blur(20px)",
            duration: 1.5,
            stagger: 0.2,
            ease: "power4.out"
        });

        gsap.utils.toArray(".scroll-effect").forEach(section => {
            gsap.timeline({
                scrollTrigger: {
                    trigger: section,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: 1
                }
            })
            .fromTo(section, 
                { scale: 0.9, rotationX: -10, opacity: 0.5 }, 
                { scale: 1, rotationX: 0, opacity: 1, duration: 1, ease: "none" }
            )
            .to(section, 
                { scale: 0.9, rotationX: 10, opacity: 0.5, duration: 1, ease: "none" }
            );
        });

        const downloadUrl = "https://github.com/7controversed/CPS-Guard/releases/download/v1.2/CPS-Guard.zip";

        function handleDownload() {
            const modal = document.getElementById('download-modal');
            modal.classList.add('active');
            setTimeout(() => { window.location.href = downloadUrl; }, 800);
        }

        function closeModal() {
            document.getElementById('download-modal').classList.remove('active');
        }

        function scrollToVideo() {
            smoother.scrollTo("#video", true, "center center");
        }

        async function fetchDownloads() {
            const repo = "7controversed/CPS-Guard"; 
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/releases`);
                const releases = await response.json();
                let total = 0;
                releases.forEach(rel => rel.assets.forEach(as => total += as.download_count));
                animateCount(total);
            } catch (e) { document.getElementById('download-count').textContent = "150+"; }
        }

        function animateCount(target) {
            const el = document.getElementById('download-count');
            let obj = { val: 0 };
            gsap.to(obj, {
                val: target,
                duration: 2,
                ease: "power3.out",
                onUpdate: () => el.textContent = Math.ceil(obj.val)
            });
        }

        fetchDownloads();
    </script>
</body>
</html>
